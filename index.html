<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1512" />
    <meta name="description" content="QADA — учёт, расчёт и возмещение пропущенных намазов" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>QADA — قضاء الصلاة</title>
    <script>
      // Тема применяется до отрисовки, чтобы не было вспышки светлого фона.
      try {
        var s = JSON.parse(localStorage.getItem('qada:v1') || '{}');
        var t = (s.settings && s.settings.theme) || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
