# Сборка мобильных приложений.
#  - Android: отладочный APK для установки на телефон (артефакт «qada-android-apk»).
#  - iOS: сборка для симулятора — проверка, что проект компилируется (подпись и TestFlight — отдельно,
#    нужен аккаунт Apple Developer).
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Ключ подписи (если задан в секретах)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Пробелы и переносы строк могли попасть при копировании — убираем их.
            CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n')
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null; then
              echo "::error::Секрет ANDROID_KEYSTORE_BASE64 повреждён (длина ${#CLEAN} символов, ожидается 5680). Скопируйте значение заново целиком."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::Ключ не открывается: проверьте секреты ANDROID_KEYSTORE_PASSWORD (длина ${#STORE_PASS}, ожидается 28) и ANDROID_KEY_ALIAS (ожидается qada)."
              exit 1
            fi
            echo "Ключ подписи прочитан."
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — собирается отладочный APK с временным ключом (обновления поверх не установятся)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Сборка
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          export VERSION_NAME=$(node -p "require('../package.json').version")
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../qada.apk
            cp app/build/outputs/bundle/release/app-release.aab ../qada.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../qada.apk
          fi
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: qada-android
          path: |
            qada.apk
            qada.aab
          if-no-files-found: warn
          retention-days: 30
      # Постоянная прямая ссылка для установки на телефон (без входа в GitHub):
      # https://github.com/<owner>/<repo>/releases/download/android-latest/qada.apk
      - name: Опубликовать APK в релиз «android-latest»
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "QADA для Android" --notes "Сборка из ветки main."
          gh release upload android-latest qada.apk --clobber
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then KIND="подписана постоянным ключом — обновления ставятся поверх"; else KIND="отладочная, временный ключ"; fi
          gh release edit android-latest --notes "Сборка ${GITHUB_SHA::7} из ветки main ($KIND). Обновляется автоматически."
        env:
          GH_TOKEN: ${{ github.token }}

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator (без подписи)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          test -f build/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy
      - name: Архив Release без подписи (проверка конфигурации для TestFlight)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO archive | tail -n 40
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
