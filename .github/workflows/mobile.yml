# Сборка мобильных приложений.
#  - Android: отладочный APK для установки на телефон (артефакт «qada-android-apk»).
#  - iOS: сборка для симулятора — проверка, что проект компилируется (подпись и TestFlight — отдельно,
#    нужен аккаунт Apple Developer).
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      # Ключ подписи Android. Нужен ОДИН секрет — ANDROID_SIGNING_PASSPHRASE (парольная фраза, которую
      # владелец придумывает сам). При первой сборке ключ создаётся автоматически, шифруется этой фразой
      # (AES-256, PBKDF2) и сохраняется в репозитории: android/signing/upload-key.p12.enc.
      # Без фразы зашифрованный файл бесполезен. Дальше все сборки подписываются этим же ключом.
      - name: Ключ подписи
        id: signing
        env:
          PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          ENC=android/signing/upload-key.p12.enc
          KS="$RUNNER_TEMP/upload.p12"
          if [ -z "$PASSPHRASE" ]; then
            echo "::warning::Секрет ANDROID_SIGNING_PASSPHRASE не задан — собирается отладочный APK с временным ключом (обновления поверх не установятся)."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ${#PASSPHRASE} -lt 10 ]; then
            echo "::error::Парольная фраза в секрете ANDROID_SIGNING_PASSPHRASE слишком короткая (${#PASSPHRASE} символов). Нужно не меньше 10."
            exit 1
          fi
          # Пароль хранилища ключей Android должен быть только из латиницы, а фраза может быть на любом языке —
          # поэтому пароль хранилища вычисляется из фразы (SHA-256) и скрывается в журналах.
          KEYPASS=$(printf '%s' "$PASSPHRASE" | sha256sum | cut -c1-40)
          echo "::add-mask::$KEYPASS"
          if [ -f "$ENC" ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$KS" -pass env:PASSPHRASE 2>/dev/null; then
              echo "::error::Не удалось расшифровать ключ: фраза в ANDROID_SIGNING_PASSPHRASE не совпадает с той, с которой ключ был создан."
              exit 1
            fi
            echo "Ключ подписи расшифрован."
          else
            if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Создаю постоянный ключ подписи…"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias qada -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$KEYPASS" -keypass "$KEYPASS" -dname "CN=QADA, O=QADA, C=KG"
            mkdir -p android/signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -out "$ENC" -pass env:PASSPHRASE
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Android: зашифрованный ключ подписи (создан автоматически сборкой)"
            git push
            echo "Ключ создан и сохранён в зашифрованном виде: $ENC"
          fi
          keytool -list -keystore "$KS" -storepass "$KEYPASS" -alias qada >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Сборка
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: qada
        run: |
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          export VERSION_NAME=$(node -p "require('../package.json').version")
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../qada.apk
            cp app/build/outputs/bundle/release/app-release.aab ../qada.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../qada.apk
          fi
          rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: qada-android
          path: |
            qada.apk
            qada.aab
          if-no-files-found: warn
          retention-days: 30
      # Постоянная прямая ссылка для установки на телефон (без входа в GitHub):
      # https://github.com/<owner>/<repo>/releases/download/android-latest/qada.apk
      - name: Опубликовать APK в релиз «android-latest»
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "QADA для Android" --notes "Сборка из ветки main."
          gh release upload android-latest qada.apk --clobber
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then KIND="подписана постоянным ключом — обновления ставятся поверх"; else KIND="отладочная, временный ключ"; fi
          gh release edit android-latest --notes "Сборка ${GITHUB_SHA::7} из ветки main ($KIND). Обновляется автоматически."
        env:
          GH_TOKEN: ${{ github.token }}

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator (без подписи)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          test -f build/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy
      - name: Архив Release без подписи (проверка конфигурации для TestFlight)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO archive | tail -n 40
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
