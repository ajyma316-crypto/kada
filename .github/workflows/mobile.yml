# Сборка мобильных приложений.
#  - Android: отладочный APK для установки на телефон (артефакт «qada-android-apk»).
#  - iOS: сборка для симулятора — проверка, что проект компилируется (подпись и TestFlight — отдельно,
#    нужен аккаунт Apple Developer).
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: qada-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # Постоянная прямая ссылка для установки на телефон (без входа в GitHub):
      # https://github.com/<owner>/<repo>/releases/download/android-latest/qada.apk
      - name: Publish APK to release «android-latest»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qada.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "QADA для Android (тестовая сборка)" \
              --notes "Тестовая сборка APK из ветки main. Обновляется автоматически при каждом изменении."
          gh release upload android-latest qada.apk --clobber
          gh release edit android-latest --notes "Тестовая сборка APK из ветки main (${GITHUB_SHA::7}). Обновляется автоматически при каждом изменении."
        env:
          GH_TOKEN: ${{ github.token }}

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator (без подписи)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
